name: CI

on:
  push:
    branches: [main]
  pull_request:

# Hanya baca isi repo; tidak ada rahasia yang dipakai dan tidak memakai pull_request_target,
# jadi PR dari fork tidak bisa mengakses apa pun yang sensitif.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tes backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Aksi dikunci ke SHA commit (bukan tag) agar tag yang digeser tidak bisa menyisipkan kode.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Tiap berkas tes dijalankan di prosesnya sendiri (masing-masing memakai database sementara
      # dan mengatur DATABASE_URL sebelum mengimpor aplikasi). Semua dijalankan dulu, baru gagal.
      - name: Jalankan semua tes
        env:
          PYTHONPATH: .
        run: |
          gagal=()
          for berkas in tests/test_*.py; do
            echo "::group::$berkas"
            if ! python "$berkas"; then gagal+=("$berkas"); fi
            echo "::endgroup::"
          done
          if [ "${#gagal[@]}" -gt 0 ]; then
            echo "::error::Tes gagal: ${gagal[*]}"
            exit 1
          fi

  frontend:
    name: Periksa frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      # Versi pnpm mengikuti "packageManager" di package.json lewat corepack (disertakan Node 24).
      # Diaktifkan setelah setup-node agar shim menunjuk ke Node yang benar.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Tipe (tsc)
        run: pnpm exec tsc --noEmit
      # Masih ada error React Compiler di empat komponen grafik (LAPORAN-BUG B-6).
      # Dibiarkan tidak memblokir sampai diperbaiki, lalu hapus continue-on-error.
      - name: Lint (eslint)
        run: pnpm exec eslint
        continue-on-error: true
      - name: Build
        run: pnpm exec next build
